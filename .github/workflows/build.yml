name: Test, build and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python -m compileall -q server.py settings.py quiz.py
      - run: python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/voicebot.js').write_text(s.split('<script>')[1].split('</script>')[0])"
      - run: node --check /tmp/voicebot.js
      - uses: azure/setup-helm@v4
      - run: helm lint helm/voicebot-poc && helm template voicebot helm/voicebot-poc > /tmp/voicebot.yaml
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/l-ra/voicebot-poc:${{ steps.version.outputs.version }}
            ghcr.io/l-ra/voicebot-poc:sha-${{ github.sha }}
            ghcr.io/l-ra/voicebot-poc:latest
      - uses: azure/setup-helm@v4
      - name: Publish OCI Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package helm/voicebot-poc --version "$VERSION" --app-version "$VERSION"
          helm push "voicebot-poc-$VERSION.tgz" oci://ghcr.io/l-ra/charts
